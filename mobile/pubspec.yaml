name: style_mirror
description: Offline-first photo and video editing companion for Stylora.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  video_player: ^2.9.2
  image: ^4.5.4
  share_plus: ^10.1.4
  gal: ^2.3.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
